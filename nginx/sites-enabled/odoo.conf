
# limit_req_zone $binary_remote_addr zone=odoolimit:10m rate=10r/s;

server {
    server_name ~^(.+)\.eniemela.fi$;
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}

server {
    server_name ~^(.+)\.eniemela.fi$;
    listen 443 ssl;
    listen [::]:443 ssl;
    proxy_read_timeout 7200s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # cd /etc/ssl && openssl req -nodes -x509 -new -subj "/CN=*.eniemela.fi" -addext "subjectAltName = DNS:*.eniemela.fi" -keyout private/nginx-selfsigned.key -out certs/nginx-selfsigned.crt -days 3650
    ssl_protocols TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/eniemela.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eniemela.fi/privkey.pem;

    access_log /var/log/nginx/odoo.access.log;
    error_log /var/log/nginx/odoo.error.log;

    # Add Headers for odoo proxy mode
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Restore the original IP address from Cloudflare.
    # https://www.cloudflare.com/ips/
    proxy_set_header CF-Connecting-IP $http_CF_Connecting_IP;
    set_real_ip_from   0.0.0.0/0;
    set_real_ip_from   ::/0;
    real_ip_header     CF-Connecting-IP;

    # limit_req zone=odoolimit burst=200 nodelay;
    location ~* /web/database/ {
        return 403;
    }

    # Redirect websocket requests to odoo gevent port
    location /websocket {
        proxy_pass http://$targetGevent;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect requests to odoo backend server
    location / {
        proxy_redirect off;
        proxy_pass http://$targetHttp;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # common gzip
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
    gzip on;
}