server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: https://loki.eniemela.fi:3110/loki/api/v1/push
    tls_config:
      insecure_skip_verify: true

scrape_configs:
- job_name: system
  static_configs:
  - targets:
      - localhost
    labels:
      job: 16.0-odoo-varlogs
      __path__: /var/log/*log


scrape_configs:
- job_name: docker
  pipeline_stages:
    - docker: {}
  static_configs:
    labels:
      job: 16.0-odoo-docker
      __path__: /var/lib/docker/containers/*/*-json.log
