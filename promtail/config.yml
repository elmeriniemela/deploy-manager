server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: https://loki.eniemela.fi:3110/loki/api/v1/push
    tls_config:
      insecure_skip_verify: true

scrape_configs:
- job_name: system
  static_configs:
  - targets:
      - localhost
    labels:
      job: 19.0-odoo-varlogs
      __path__: /var/log/**/*log
