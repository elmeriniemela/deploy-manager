server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: https://loki.eniemela.fi:3110/loki/api/v1/push
    tls_config:
      insecure_skip_verify: true

scrape_configs:
- job_name: system
  static_configs:
  - targets:
      - localhost
    labels:
      job: 16.0-odoo-varlogs
      __path__: /var/log/*log
- job_name: docker
  static_configs:
  - targets:
      - localhost
    labels:
      job: 16.0-odoo-docker
      __path__: /var/lib/docker/containers/*/*-json.log
  pipeline_stages:

  - json:
      expressions:
        stream: stream
        attrs: attrs
        tag: attrs.tag

  - regex:
      expression: (?P<image_name>(?:[^|]*[^|])).(?P<container_name>(?:[^|]*[^|])).(?P<image_id>(?:[^|]*[^|])).(?P<container_id>(?:[^|]*[^|]))
      source: "tag"

  - labels:
      tag:
      stream:
      image_name:
      container_name:
      image_id:
      container_id:

