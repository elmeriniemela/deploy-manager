name: Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jinja2 python3-psycopg2 python3-requests

      - name: Run agentd unit tests
        run: python3 -m unittest discover -s agentd/tests -t .

      - name: Run cronsyl unit tests
        working-directory: agentd/cronsyl
        run: python3 -m unittest discover
